name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: python -m pip install --upgrade pip pytest ruff ".[visualization]"

      - name: Run tests
        run: pytest

      - name: Run Ruff
        if: matrix.python-version == '3.13'
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts

  tutorials:
    name: Execute tutorials
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tutorial dependencies
        run: python -m pip install --upgrade pip ".[tutorials]"

      - name: Execute notebooks
        run: |
          mkdir -p /tmp/asset-management-toolkit-notebooks
          for notebook in tutorials/*.ipynb; do
            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --output-dir /tmp/asset-management-toolkit-notebooks \
              --ExecutePreprocessor.timeout=120
          done
