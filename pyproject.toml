[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-management-toolkit"
version = "0.9.0"
description = "Reusable Python analytics for asset-management research"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
factor-model = [
  "scikit-learn>=1.3",
]
forecasting = [
  "statsmodels>=0.14",
]
graphical = [
  "scikit-learn>=1.3",
]
visualization = [
  "dash>=2.17",
  "plotly>=5.20",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
]
tutorials = [
  "dash>=2.17",
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "plotly>=5.20",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP045"]
